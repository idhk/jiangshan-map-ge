<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>格鲁吉亚历史时间轴 · 江山时序</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
      body { margin: 0; }
      main { max-width: 56rem; margin: auto; padding: 1.5rem; }
      h1, h2, h3 { line-height: 1.3; }
      form:not([hidden]) { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
      input, button { font: inherit; padding: .25rem .5rem; }
      input { width: 6rem; }
      li + li { margin-top: .4rem; }
    </style>
    <script defer src="ge_dynasty_data.js"></script>
    <script defer src="ge_polities.js"></script>
    <script defer src="timeline.js"></script>
  </head>
  <body>
    <main>
      <a href="../">江山时序</a>
      <h1>格鲁吉亚历史时间轴</h1>
      <p>查看南高加索历史阶段和里程碑。疆域边界尚未绘制，阶段说明来自数据草案。</p>
      <form id="timeline" hidden>
        <label for="year">年份（公元前用负数）</label>
        <input id="year" name="year" type="number" required>
        <button type="submit">查看</button>
      </form>
      <p id="status" role="status">时间轴数据加载中。</p>
      <section id="era" hidden aria-labelledby="era-name">
        <h2 id="era-name"></h2>
        <p id="era-ka" lang="ka"></p>
        <p id="era-summary"></p>
        <h3 id="phase"></h3>
        <p id="border"></p>
        <h3>阶段政权</h3>
        <ul id="polities"></ul>
        <h3>本时代里程碑</h3>
        <ol id="events"></ol>
      </section>
      <noscript>查看时间轴需要启用 JavaScript。</noscript>
    </main>
  </body>
</html>
